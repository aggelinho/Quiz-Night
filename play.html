<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quiz Night</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="game">
  <header class="appbar">
    <div class="wrap appbar-in">
      <a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true">QN</span><span>Quiz Night</span></a>
      <nav class="appnav" aria-label="Quiz">
        <a href="play.html?quiz=football" data-nav="football">Quizball</a>
        <a href="play.html?quiz=basketball" data-nav="basketball">Crunch Time</a>
        <a href="play.html?quiz=geo" data-nav="geo">Γεωγραφία</a>
      </nav>
      <span id="roomTag" class="room-tag"></span>
    </div>
  </header>
  <main class="wrap">
    <div id="app"></div>
  </main>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/data/geo-countries.js"></script>
  <script src="js/data/geo-extra.js"></script>
  <script src="js/data/football.js"></script>
  <script src="js/data/basketball.js"></script>
  <script src="js/match.js"></script>
  <script src="js/questions.js"></script>
  <script>
    // Τα δεδομένα του Quizball (~2 MB) φορτώνονται μόνο για το ποδοσφαιρικό quiz
    if ((new URLSearchParams(location.search).get('quiz') || 'football') === 'football') {
      document.write('<script src="js/data/quizball.js"><\/script><script src="js/quizball.js"><\/script><script src="js/play-qb.js"><\/script>');
    }
  </script>
  <script src="js/engine.js"></script>
  <script src="js/online.js"></script>
  <script src="js/map.js"></script>
  <script src="js/play.js"></script>
</body>
</html>
